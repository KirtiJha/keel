name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The router fixture suite and the gotcha scanner read git history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Bundle size and zod-free hooks
        run: npm run bench:size

      - name: Test
        run: npm run test

      # Reported, not gated. The plan gates on mutation score, never coverage:
      # coverage targets produce tests that execute code without checking it.
      - name: Coverage (reported, not gated)
        run: npm run coverage
        continue-on-error: true

      - name: Verify committed bundles match a fresh build
        run: |
          if ! git diff --quiet -- scripts/; then
            echo "::error::scripts/ is out of date — run \`npm run build\` and commit the result"
            git diff --stat -- scripts/
            exit 1
          fi
          echo "committed bundles match a fresh build"

  hook-performance:
    name: Hook cold start (reported, not gated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build

      # Reported, not gated — the measurement is too noisy to gate on.
      #
      # The benchmark reports `own = p50 − spawnFloor`: one noisy number minus
      # another. Three consecutive runs on identical code produced 3, 1 and 1
      # hooks "OVER BUDGET", and the measured Node spawn floor moved 57 → 84 ms
      # (47%) across those same runs. A subtraction of two independently noisy
      # quantities cannot distinguish a 30 ms regression from scheduler jitter,
      # so a red build here carries no information about the diff — and a gate
      # that fails for reasons unrelated to the diff gets disabled, which leaves
      # no gate at all.
      #
      # This stays non-gating until the methodology is fixed in
      # `scripts-dev/bench-coldstart.mjs`: the floor and the hook need to be
      # measured in the same interleaved sample so the subtraction cancels drift
      # rather than compounding it, and the pass/fail decision needs to be made
      # on a statistic with a stated confidence interval rather than on a single
      # p50 point estimate. Re-gate once a run on unchanged code is reproducibly
      # green.
      - name: Hook cold start
        run: npm run bench:coldstart
        continue-on-error: true

  python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned exactly, for the same reason `keel check` rejects a floating
      # version in `upstream.lock`: an unpinned tool can break the build with no
      # commit behind it. These are the versions this repository's Python
      # checks were last verified green against — bump them deliberately, in a
      # commit, after re-running `npm run py:lint py:types py:test`.
      - name: Install dev tooling
        run: pip install pytest==9.0.2 ruff==0.15.8 mypy==1.19.1
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy --strict keel_gates
      - name: Test
        run: pytest -q

  mutation:
    name: Mutation score
    runs-on: ubuntu-latest
    # Runs on pushes to main as well as on PRs. Mutation score is this
    # project's stated replacement for coverage (rule of the road 4), so a
    # direct push to the default branch — which no PR ever reviewed — is
    # exactly the change that must not skip it. The gate is diff-only, so the
    # only thing a push needs is a base ref: `github.event.before` is the
    # branch tip whether the push was a merge commit, a squash, or a
    # fast-forward, which makes the diff the change that just landed.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Rule of the road 4: mutation score, never coverage. Confined to the
      # lines this change touched, so a legacy file is never a cleanup project.
      - name: keel mutate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          elif git rev-parse --verify --quiet "${{ github.event.before }}^{commit}" >/dev/null; then
            # The tip before this push, not `HEAD^`. They agree for a merge
            # commit and for a squash, but a rebase-merge fast-forwards N
            # commits at once — and `HEAD^` then names the second-to-last of
            # them, so everything before it is never gated and never mutated.
            base="${{ github.event.before }}"
          elif git rev-parse --verify --quiet "HEAD^" >/dev/null; then
            base="HEAD^"
          else
            echo "root commit — no base to diff against, nothing to mutate"
            exit 0
          fi
          node scripts/cli.mjs mutate --against "$base"

  spec-discipline:
    name: Spec discipline
    runs-on: ubuntu-latest
    # Scoped to this job only, because only this job writes anything. The
    # workflow default is `contents: read`; a job that declares `permissions`
    # replaces that default rather than adding to it, so `contents: read` is
    # repeated here deliberately.
    #
    # Without `pull-requests: write` the `gh pr comment` step below 403s. It is
    # wrapped in `continue-on-error`, so that failure was silent on every PR.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build

      # Plan rules 2 and 3: archive at merge, and the ~250-line cap. The archive
      # gate only fires on the default branch, which is where an unarchived
      # proposal means the delta never folded into the capability spec.
      - name: keel spec check
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            node scripts/cli.mjs spec check --default-branch
          else
            node scripts/cli.mjs spec check
          fi

      # Plan rule 4: attach the delta to the PR. Best-effort — a change with no
      # proposal is not an error, it is most changes.
      - name: Attach the spec delta to the PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if node scripts/cli.mjs spec delta --out /tmp/delta.md 2>/dev/null; then
            gh pr comment "${{ github.event.pull_request.number }}" \
              --body-file /tmp/delta.md --edit-last --create-if-none
          else
            echo "no proposal for this branch — nothing to attach"
          fi

  standards-gates:
    name: Standards gates
    runs-on: ubuntu-latest
    # The standards gates otherwise run in one place only: Claude Code's
    # PostToolUse hook. Any change authored outside Claude Code —
    # another editor, a bot, a web edit, a direct push — never meets them, so
    # org rules are enforced for some authors and not others. This job is where
    # they apply to everyone.
    #
    # `keel gate` accepts `--against <ref>`, `--json`, `--all` and
    # `--trust-repo-rules` (`src/cli/registry.ts`, wired in `src/cli/main.ts`).
    # `--all` is deliberately not passed: CI blocks on `high`-severity findings,
    # and advisory ones belong in the editing loop where they can be acted on.
    # `--trust-repo-rules` is passed, for the reason given at the step itself.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Diff-only, like the hook: findings on lines this change did not touch
      # are dropped by the runner, so a legacy file is never a cleanup project.
      - name: keel gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          elif git rev-parse --verify --quiet "${{ github.event.before }}^{commit}" >/dev/null; then
            # The tip before this push, not `HEAD^`. They agree for a merge
            # commit and for a squash, but a rebase-merge fast-forwards N
            # commits at once — and `HEAD^` then names the second-to-last of
            # them, so everything before it is never gated and never mutated.
            base="${{ github.event.before }}"
          elif git rev-parse --verify --quiet "HEAD^" >/dev/null; then
            base="HEAD^"
          else
            echo "root commit — no base to diff against, nothing to gate"
            exit 0
          fi
          # `--trust-repo-rules` because a runner cannot approve anything. Rule
          # approval protects a developer's machine from a repository they have
          # merely opened; this job has already checked the repository out and
          # is already running its code, so the approval adds no privilege and
          # there is no key that survives the runner to sign one. Without the
          # flag every repo-local pack reports unapproved and this job fails
          # telling a machine to run `keel trust add`.
          node scripts/cli.mjs gate --against "$base" --trust-repo-rules

  self-check:
    name: keel check (dogfood)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Keel validating itself. Upstream is pinned, so this must now pass;
      # outstanding internal mirrors are warnings by design.
      - name: keel check
        run: node scripts/cli.mjs check
