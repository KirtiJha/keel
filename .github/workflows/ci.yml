name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The router fixture suite and the gotcha scanner read git history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Bundle size and zod-free hooks
        run: npm run bench:size

      - name: Test
        run: npm run test

      # Reported, not gated. The plan gates on mutation score, never coverage:
      # coverage targets produce tests that execute code without checking it.
      - name: Coverage (reported, not gated)
        run: npm run coverage
        continue-on-error: true

      - name: Verify committed bundles match a fresh build
        run: |
          if ! git diff --quiet -- scripts/; then
            echo "::error::scripts/ is out of date — run \`npm run build\` and commit the result"
            git diff --stat -- scripts/
            exit 1
          fi
          echo "committed bundles match a fresh build"

  hook-performance:
    name: Hook cold start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Gated on p50; p95 is reported. See the comment in the benchmark for why.
      - run: npm run bench:coldstart

  python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev tooling
        run: pip install pytest ruff mypy
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy --strict keel_gates
      - name: Test
        run: pytest -q

  self-check:
    name: keel check (dogfood)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      # `keel check` exits 1 here on purpose: upstream.lock ships UNPINNED
      # because the versions are a blocked human input (build spec §1). This
      # step asserts that the *only* failures are those, so a real regression
      # in check still fails the build.
      - name: keel check reports only the documented blocked inputs
        run: |
          set +e
          output=$(node scripts/cli.mjs check 2>&1)
          status=$?
          set -e
          echo "$output"

          errors=$(echo "$output" | grep -c '✗' || true)
          unpinned=$(echo "$output" | grep -c 'UNPINNED' || true)

          if [ "$status" -eq 0 ]; then
            echo "::error::keel check unexpectedly passed — upstream.lock should still be UNPINNED"
            exit 1
          fi
          if [ "$errors" -ne "$((unpinned + 1))" ]; then
            echo "::error::keel check reported errors beyond the documented UNPINNED inputs"
            exit 1
          fi
          echo "only the documented blocked inputs failed"
